name: Test

on:
  push:
  pull_request:

env:
  # Single source for the kit's Python floor (ADR 0026): the version the
  # floor pass provisions and the version it asserts it actually got, so the
  # two can never disagree.
  FLOOR_PYTHON: '3.9'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep shellcheck

      - name: Run validation
        run: make test

      # Floor pass (ADR 0026 amendment): the whole suite again under the
      # kit's Python floor, so newer-than-floor syntax in any kit Python
      # tool — today's checkers and heredocs, tomorrow's rewritten
      # installers — fails here instead of on a stock machine. If this
      # step ever cannot provision the floor version, that is the signal
      # to raise the floor, not to drop the step.
      - name: Set up floor Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.FLOOR_PYTHON }}

      # The assert guards a different property than the pass itself: that the
      # pass is genuinely running at the floor. Newer-than-floor syntax still
      # has to die at parse time inside `make test` (a runtime check cannot
      # catch it), but without this a changed input or a future action
      # resolving differently would silently turn the floor pass into a
      # duplicate of the run above, and nothing would say so.
      - name: Run validation under the floor Python
        run: |
          python3 --version
          python3 -c "import sys; want = tuple(int(p) for p in '$FLOOR_PYTHON'.split('.')); got = sys.version_info[:len(want)]; assert got == want, 'floor pass ran under Python %s, not the $FLOOR_PYTHON floor' % '.'.join(map(str, got))"
          make test
